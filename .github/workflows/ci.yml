name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Tests mock every LLM call; make sure nothing can reach the real API.
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_BASE_URL: "http://127.0.0.1:9"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --no-extra embeddings
      # The commands live in the Makefile so that `make check` locally is what CI runs.
      - name: Lint (ruff check + ruff format --check)
        run: make lint
      - name: Unit tests with branch coverage, then the coverage gate
        # pyproject's addopts deselect `slow` tests (the sandbox fuzzer, run by nightly.yml).
        # The gate measures this default run only: every line under src/ must be reachable from
        # a fast test, so a slow-only code path shows up as missing here. Floors (overall 92%,
        # sandbox/ 97%, core/loop.py 98%) are the Makefile's `coverage` target; raise them there
        # as coverage improves.
        run: make coverage

  test-macos:
    # The sandbox's kernel layers are Linux-only; on macOS it must fall back to rlimits + the
    # audit hook rather than crash (it once failed at import on the Linux-only `prctl`). Lint
    # and the full suite, no coverage gate: `@pytest.mark.linux_only` tests skip here.
    runs-on: macos-latest
    timeout-minutes: 20
    env:
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_BASE_URL: "http://127.0.0.1:9"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --no-extra embeddings
      - name: Lint (ruff check + ruff format --check)
        run: make lint
      - name: Unit tests (Linux-only kernel-layer tests skip)
        run: make test

  eval-smoke:
    # Offline end-to-end checks: no API key, no network to the LLM. Catches prompt / loop /
    # harness changes that break the pipeline before they reach a paid eval run.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ANTHROPIC_API_KEY: ""
      ANTHROPIC_BASE_URL: "http://127.0.0.1:9"
      AGENT_ARTIFACTS_DIR: ${{ runner.temp }}/artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --all-extras --no-extra embeddings
      - name: Offline eval gate (make eval)
        # Three steps, defined in the Makefile:
        #  1. oracle agent must score 100% (no judge: L3 rubric tasks are skipped);
        #  2. core agent dry run, scripted FakeLLM, 3 tasks: real loop, tools and sandbox, every
        #     task must complete (no error, timeout, max_turns or budget stop);
        #  3. the same with every feature flag on (routing, semantic layer, structured reports,
        #     memory, approval gating every SELECT with auto-approve, trace store, JSON logs).
        run: make eval RUNS=${{ runner.temp }}/runs
      - name: Upload eval runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-smoke-runs
          path: ${{ runner.temp }}/runs
