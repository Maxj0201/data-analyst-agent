report: |
  ## 2025 e-commerce overview

  Net revenue from completed orders in 2025 was $435,064, computed as quantity x unit_price x (1 - discount_pct); cancelled and returned orders are excluded.

  Electronics is by far the largest category at $188,412 (43% of net revenue), followed by Home at $75,966.

  By customer segment, Enterprise contributes the most net revenue ($200,914, 46%), ahead of SMB ($141,781) and Consumer ($92,369).

  Revenue is strongly seasonal: Q4 brought 36% of the year's revenue, and November was the peak month at $64,462, more than double January ($27,855).

  Recommendation: build Q4 inventory and campaigns around Electronics for Enterprise buyers, the combination that drives most revenue, and plan fulfilment capacity for the November peak.
