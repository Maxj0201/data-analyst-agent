note: >-
  Reads well and gets the drivers and seasonality right, but counts returned orders as revenue,
  so the headline figure is about 7.5% too high and the treatment of returns is never stated.
report: |
  ## 2025 e-commerce overview

  Net revenue from 2025 orders was $467,654 after discounts, excluding cancelled orders.

  Electronics is the largest product category with about 43% of net revenue.

  Enterprise customers contribute the most net revenue (about 46%), followed by SMB and Consumer.

  The year built steadily to a Q4 peak, with November the strongest month.

  Recommendation: concentrate Q4 promotions on Electronics for Enterprise accounts, which together drive most revenue.
