report: |
  ## Carrier reliability

  On-time delivery (delivered_date on or before promised_delivery_date) across 3,767 shipments: SwiftShip 95.8%, PostCo 94.8%, ParcelNow 79.7%. ParcelNow is clearly the least reliable carrier.

  The gap is seasonal: ParcelNow delivers 89.6% on time for orders placed January-October but only 52.3% for November-December orders, while PostCo (95.2%) and SwiftShip (94.7%) hold steady in the peak months.

  ParcelNow accounts for 183 of the 316 late shipments (58%) despite carrying only 24% of volume.

  Recommendation: move November-December volume from ParcelNow to SwiftShip or PostCo, and renegotiate ParcelNow's SLA with penalties for peak-season misses.
