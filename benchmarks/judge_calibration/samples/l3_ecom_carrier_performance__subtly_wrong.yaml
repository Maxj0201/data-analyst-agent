report: |
  ## Carrier reliability

  On-time rates: SwiftShip 95.8%, PostCo 94.8%, ParcelNow 79.7%, so ParcelNow is the least reliable carrier.

  ParcelNow's performance slips in the summer, falling to about 70% on time for July-August orders, while the other carriers are stable through the year.

  ParcelNow accounts for 183 of the 316 late shipments.

  Recommendation: shift ParcelNow volume to SwiftShip during the summer months and review its SLA.
