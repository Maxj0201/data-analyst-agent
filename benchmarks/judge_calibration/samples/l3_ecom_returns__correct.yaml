report: |
  ## Product returns

  291 of 4,000 orders were returned, an overall return rate of 7.3%.

  Returns are concentrated in Apparel, which has a 15.5% return rate, roughly 2.5 times every other category (5.4%-6.2%).

  Return rates rise with discount depth: 4.3% of orders with no discount are returned, versus 9.9% at a 10% discount and 13.0% at a 30% discount.

  Recommendation: cap routine discounts at 10% and add size guides and fit information to Apparel product pages, the two levers most associated with returns.
