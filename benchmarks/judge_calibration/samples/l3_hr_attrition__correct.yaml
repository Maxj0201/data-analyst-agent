report: |
  ## Employee attrition

  60 employees left in 2025 against 376 employed at the start of the year, an attrition rate of 16.0%.

  Termination rates (terminated / everyone ever employed in the department) are highest in Sales (33.8%, 26 of 77) and Support (32.6%, 29 of 89); Marketing is lowest at 7.9%.

  Performance matters most: employees rated 1-2 have a 47.8% termination rate versus 16.9% for those rated 3-5.

  Recommendations: run stay interviews and review workload and pay in Sales and Support, and pair low performers with structured improvement plans and coaching before they reach the exit stage.
