report: |
  ## Employee attrition

  60 employees left in 2025 against 376 employed at the start of the year, an attrition rate of 16.0%.

  The highest termination rates are in HR (21.7%) and Engineering (20.9%).

  Surprisingly, high performers are the ones leaving: employees rated 3-5 have a 47.8% termination rate versus 16.9% for those rated 1-2.

  Recommendations: introduce retention bonuses for high performers in HR and Engineering.
