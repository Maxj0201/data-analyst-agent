report: |
  ## Subscription churn drivers

  417 of 1,500 subscriptions (27.8%) have churned.

  Churn falls steadily with plan tier: Basic 39.8%, Pro 25.3%, Business 13.9%, Enterprise 11.6%.

  Monthly billing churns far more than annual billing (33.9% vs 18.1%).

  By region, APAC has the highest churn rate at 31.7%, ahead of North America (28.3%), LATAM (26.9%) and EMEA (25.3%).

  Price is the most common churn reason (135 of 417 churned subscriptions), followed by missing features (117).

  Recommendations: offer discounted annual plans to monthly Basic customers, review Basic pricing and packaging given the price-driven churn, and add a customer-success touchpoint for APAC accounts.
