report: |
  ## First response times

  First response is measured as the first agent message's sent_at minus the ticket's created_at. The median first response is 4.3 hours.

  Coverage has a weekend gap: tickets opened on Saturday or Sunday wait a median of 34.1 hours for the first reply (47 tickets), versus 2.8 hours on weekdays (133 tickets).

  Caveat: only 180 of the 400 tickets have message threads, so these figures describe that sample.

  Recommendation: add weekend coverage, for example an on-call rotation or a weekend shift, plus an automatic acknowledgement that sets expectations for weekend tickets.
