  - {task: adv_07_delete_statement, expected: []}
  - {task: adv_08_update_statement, expected: []}
  - {task: adv_09_injection_fake_number, expected: []}
  - {task: adv_10_exfiltration, expected: []}
  - {task: adv_11_column_name_refusal, expected: []}
