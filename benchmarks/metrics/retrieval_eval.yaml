# Retrieval eval for the semantic layer: which governed metric(s) each question is about.
#
# Run: python -m analyst_agent.semantic eval   (top-1 / top-3 hit rate and MRR per backend)
#
# - `task:` cases take the question and loaded tables from benchmarks/tasks/<level>/<id>.yaml,
#   exactly as the agent would see them. Every benchmark task is listed (a test enforces it).
# - `question:` cases are extra paraphrases, mostly with little word overlap with the metric
#   definitions; they need `tables:` (the loaded table names) and an `id:`.
# - `expected` lists the intended metric(s); a retrieved metric in the list is a hit. An empty
#   list means no governed metric applies (plain counts, lookups, support tickets): such cases
#   are listed for completeness but excluded from hit rate and MRR.
#
# `kind: retrieval_eval` makes the metrics loader skip this file when it scans the directory.
kind: retrieval_eval
version: 1
cases:
  # --- L1
  - {task: l1_ecom_avg_price_electronics, expected: []}
  - {task: l1_ecom_cancelled_orders, expected: [cancellation_rate]}
  - {task: l1_ecom_customers_germany, expected: []}
  - {task: l1_ecom_max_quantity, expected: []}
  - {task: l1_ecom_order_count, expected: []}
  - {task: l1_hr_engineering_headcount, expected: [headcount]}
  - {task: l1_hr_gross_pay_march_2025, expected: []}
  - {task: l1_hr_median_salary_current, expected: [median_base_salary]}
  - {task: l1_hr_terminations_2025, expected: [attrition_rate]}
  - {task: l1_saas_active_mrr, expected: [active_mrr]}
  - {task: l1_saas_active_subscriptions, expected: []}
  - {task: l1_saas_enterprise_accounts, expected: []}
  - {task: l1_ecom_marketing_spend_2025, expected: []}
  - {task: l1_ecom_missing_signup_channel, expected: []}
  - {task: l1_ecom_mobile_app_orders, expected: []}
  - {task: l1_ecom_parcelnow_shipments, expected: []}
  - {task: l1_hr_remote_current, expected: [headcount]}
  - {task: l1_hr_total_bonus_2025, expected: []}
  - {task: l1_hr_total_budget, expected: []}
  - {task: l1_saas_annual_billing, expected: []}
  - {task: l1_saas_api_calls_march, expected: []}
  - {task: l1_saas_max_seats, expected: []}
  # Support tickets have no governed metrics; "average order_value" here is a ticket column,
  # not the ecommerce AOV metric (whose tables are not loaded, so it cannot be retrieved).
  - {task: l1_support_avg_order_value_high, expected: []}
  - {task: l1_support_open_tickets, expected: []}
  # --- L2
  # The question spells out net revenue's formula; AOV must still rank first.
  - {task: l2_ecom_aov_by_segment, expected: [average_order_value]}
  - {task: l2_ecom_net_revenue_completed, expected: [net_revenue]}
  - {task: l2_ecom_peak_month_2025, expected: [net_revenue]}
  - {task: l2_ecom_return_rate_by_category, expected: [return_rate]}
  - {task: l2_ecom_revenue_by_category, expected: [net_revenue]}
  - {task: l2_ecom_top5_customers, expected: [net_revenue, revenue_per_customer]}
  - {task: l2_hr_avg_salary_by_dept, expected: [median_base_salary]}
  - {task: l2_hr_terminations_by_dept_2025, expected: [attrition_rate, termination_rate_by_group]}
  - {task: l2_hr_top3_overtime_2025, expected: [overtime_share]}
  - {task: l2_saas_active_mrr_by_region, expected: [active_mrr]}
  - {task: l2_saas_avg_tenure_churned, expected: [average_tenure_churned]}
  - {task: l2_saas_churn_rate_2025, expected: [churn_rate]}
  - {task: l2_ecom_cac_by_channel_2024, expected: []}
