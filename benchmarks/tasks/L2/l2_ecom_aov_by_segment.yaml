id: l2_ecom_aov_by_segment
difficulty: L2
dataset:
- data/ecommerce/orders.csv
- data/ecommerce/customers.csv
- data/ecommerce/products.csv
question: What is the average order value (mean net revenue per completed order) for each customer segment?
  Net revenue = quantity * unit_price * (1 - discount_pct), counting only orders with status 'completed'.
expected:
  expected_rows:
  - segment: Consumer
    avg_order_value: 127.36
  - segment: Enterprise
    avg_order_value: 559.59
  - segment: SMB
    avg_order_value: 222.77
  tolerance: 0.005
  order_matters: false
tags:
- ecommerce
- join
- group-by
