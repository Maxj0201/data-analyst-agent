id: l2_ecom_top_product_per_category
difficulty: L2
dataset:
- data/ecommerce/orders.csv
- data/ecommerce/customers.csv
- data/ecommerce/products.csv
question: For each product category, which product has the highest net revenue, and how much? Return one
  row per category. Net revenue = quantity * unit_price * (1 - discount_pct), counting only orders with
  status 'completed'.
