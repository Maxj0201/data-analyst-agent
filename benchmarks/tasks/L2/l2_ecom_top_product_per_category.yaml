  - category: Apparel
    product_name: Hoodie
    net_revenue: 18124.79
  - category: Beauty
    product_name: Toner
    net_revenue: 11501.79
  - category: Books
    product_name: Sci-Fi Anthology
    net_revenue: 7273.22
  - category: Electronics
    product_name: Fitness Tracker
    net_revenue: 50498.97
  - category: Home
    product_name: Ceramic Vase
    net_revenue: 18801.18
  - category: Sports
    product_name: Jump Rope
    net_revenue: 15662.34
  tolerance: 0.005
  order_matters: false
tags:
