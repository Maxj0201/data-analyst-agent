[project]
name = "analyst-agent"
version = "0.1.0"
description = "Autonomous data analyst agent over tabular data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pydantic",
    "pydantic-settings",
    "duckdb",
    "pandas",
    "numpy",
    "matplotlib",
    "pyyaml",
    "typer",
]

[project.scripts]
analyst-agent = "analyst_agent.cli:app"

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
