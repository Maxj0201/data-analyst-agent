[project]
name = "analyst-agent"
version = "0.1.0"
description = "Autonomous data analyst agent over tabular data"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic",
    "pydantic",
    "pydantic-settings",
    "duckdb",
    "pandas",
    "numpy",
    "matplotlib",
    "pyyaml",
    "typer",
    "scipy>=1.17.1",
    "rank-bm25>=0.2.2",
]

[project.scripts]
analyst-agent = "analyst_agent.cli:app"
analyst-agent-mcp = "analyst_agent.mcp_server:main"

[project.optional-dependencies]
api = [
    "fastapi>=0.162.0",
    "langfuse>=5.1.0",
    "python-multipart>=0.0.33",
    "uvicorn[standard]>=0.54.0",
]
frontend = [
    "httpx>=0.28.1",
    "streamlit>=1.66.1",
]
mcp = [
    "mcp>=2.3,<3",
]
# Embedding / hybrid semantic-layer backends (AGENT_SEMANTIC_BACKEND=embedding|hybrid).
# Pulls in torch; not needed for tests (the encoder is mocked).
embeddings = [
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/analyst_agent"]

# Ship the semantic-layer metric definitions inside the package, so the default
# AGENT_SEMANTIC_METRICS_DIR resolves relative to the installed package, not the cwd.
[tool.hatch.build.targets.wheel.force-include]
"benchmarks/metrics" = "analyst_agent/semantic/metrics"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
